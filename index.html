<body>

    <!-- أولاً: واجهة تسجيل الدخول -->
    <div class="login-container" id="loginBox">

    <script>
        // ===== كلمة المرور لم تعد مكتوبة هنا، بل بصمتها (Hash) فقط =====
        // لتغييرها: افتحي الملف make-hash.html على جهازك، اكتبي اسم المستخدم وكلمة المرور الجديدين،
        // ثم انسخي قيمتي SALT_HEX و HASH_HEX إلى هنا، وزيدي CREDENTIALS_VERSION بمقدار 1
      const SALT_HEX = "3e3da1d071fd915d121d4068a62807a6";
const HASH_HEX = "273c0fe44c6c4e05503d77ef91eef6d91209b0359232f562f14ac4959fc061dc";
        const PBKDF2_ITERATIONS = 250000;
        const CREDENTIALS_VERSION = 7;

        // مدة صلاحية الجلسة: شهر واحد (30 يوم) بالمللي ثانية
        const SESSION_DURATION = 30 * 24 * 60 * 60 * 1000;

        // ===== تحكّم عن بُعد: ملف access.json في المستودع =====
        // يُفحص عند كل فتح للتطبيق وهو متصل بالنت فقط (لا يعمل بدون نت)
        // { "min_login_version": 1, "banned_users": ["اسم1","اسم2"] }
        const ACCESS_URL = "access.json";

        function forceLogout() {
            localStorage.removeItem("isLoggedIn");
            localStorage.removeItem("lastActivity");
            localStorage.removeItem("credentialsVersion");
            localStorage.removeItem("loggedInUser");
        }

        async function checkRemoteAccess() {
            try {
                const res = await fetch(ACCESS_URL + "?t=" + Date.now(), { cache: "no-store" });
                if (!res.ok) return;
                const data = await res.json();
                const storedVersion = parseInt(localStorage.getItem("credentialsVersion"), 10);
                const storedUser = localStorage.getItem("loggedInUser") || "";
                const minVersion = parseInt(data.min_login_version, 10) || 0;
                const banned = Array.isArray(data.banned_users) ? data.banned_users : [];

                if (storedVersion < minVersion || banned.includes(storedUser)) {
                    forceLogout();
                    location.reload();
                }
            } catch (e) {
                // بدون نت أو تعذّر الوصول للملف: لا شيء يتغيّر، يبقى الوضع الحالي كما هو
            }
        }

        window.onload = function() {
            const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
            const lastActivity = parseInt(localStorage.getItem("lastActivity"), 10);
            const storedVersion = parseInt(localStorage.getItem("credentialsVersion"), 10);

            const sessionValid = isLoggedIn && lastActivity && (Date.now() - lastActivity < SESSION_DURATION);
            const versionValid = storedVersion === CREDENTIALS_VERSION;

            if (sessionValid && versionValid) {
                showDashboard();
                checkRemoteAccess();
            } else {
                // انتهت مدة الجلسة، أو تغيّرت كلمة المرور، أو لا توجد جلسة صالحة: تسجيل خروج تلقائي
                forceLogout();
            }

            // إعادة الفحص كل مرة يعود فيها المستخدم للتطبيق (تبديل نافذة، فتح من الخلفية)
            document.addEventListener("visibilitychange", function () {
                if (document.visibilityState === "visible" && localStorage.getItem("isLoggedIn") === "true") {
                    checkRemoteAccess();
                }
            });
        };

        async function deriveHash(user, pass) {
            const enc = new TextEncoder();
            const salt = new Uint8Array(SALT_HEX.match(/../g).map(b => parseInt(b, 16)));
            const key = await crypto.subtle.importKey("raw", enc.encode(user + ":" + pass), "PBKDF2", false, ["deriveBits"]);
            const bits = await crypto.subtle.deriveBits(
                { name: "PBKDF2", salt: salt, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" }, key, 256);
            return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, "0")).join("");
        }

        async function checkLogin() {
            const userInp = document.getElementById("username").value;
            const passInp = document.getElementById("password").value;
            const errorMsg = document.getElementById("errorMessage");

            let ok = false;
            try { ok = (await deriveHash(userInp, passInp)) === HASH_HEX; } catch (e) { ok = false; }

            if (ok) {
                localStorage.setItem("isLoggedIn", "true");
                localStorage.setItem("lastActivity", Date.now().toString());
                localStorage.setItem("credentialsVersion", CREDENTIALS_VERSION.toString());
                localStorage.setItem("loggedInUser", userInp);
                showDashboard();
                checkRemoteAccess();
            } else {
                errorMsg.style.display = "block";
            }
        }

        function showDashboard() {
            // تحديث وقت آخر نشاط في كل مرة يتم فيها الدخول للوحة (يمدد الأسبوع من آخر زيارة)
            localStorage.setItem("lastActivity", Date.now().toString());
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("dashboardBox").style.display = "block";
            document.body.style.alignItems = "flex-start";
            document.body.style.paddingTop = "40px";
        }

        function logout() {
            forceLogout();
            location.reload(); 
        }
    </script>
